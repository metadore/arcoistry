<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="60%" stop-color="#fbeada"/>
      <stop offset="100%" stop-color="#f3d8c1"/>
    </radialGradient>

    <!-- Golden Pancake Top Shell Gradient -->
    <linearGradient id="pancakeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbf66"/>
      <stop offset="25%" stop-color="#e68a2e"/>
      <stop offset="70%" stop-color="#b35900"/>
      <stop offset="100%" stop-color="#803d00"/>
    </linearGradient>

    <!-- Pancake Highlight Glow -->
    <linearGradient id="pancakeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe6b3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffbf66" stop-opacity="0"/>
    </linearGradient>

    <!-- Golden Pancake Bottom Shell Gradient -->
    <linearGradient id="pancakeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc6600"/>
      <stop offset="50%" stop-color="#994700"/>
      <stop offset="100%" stop-color="#592900"/>
    </linearGradient>

    <!-- Fluffy Pancake Interior Edge (Sponge Cake Texture) -->
    <linearGradient id="spongeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd180"/>
      <stop offset="50%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>

    <!-- Red Bean Paste (Anko) Gradients -->
    <radialGradient id="ankoCenter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#5a1827"/>
      <stop offset="70%" stop-color="#3d0c18"/>
      <stop offset="100%" stop-color="#24050d"/>
    </radialGradient>

    <linearGradient id="ankoShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c2b3f" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#5a1827" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1f0208" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Plate Ceramic Gradient -->
    <radialGradient id="plateGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#d9e2ec"/>
    </radialGradient>

    <linearGradient id="plateRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcccdc"/>
      <stop offset="50%" stop-color="#9fb3c8"/>
      <stop offset="100%" stop-color="#829ab1"/>
    </linearGradient>

    <!-- Steam & Energy Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#592900" flood-opacity="0.35"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="steamBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
    </filter>
  </defs>

  <style>
    /* Floating & Steam Animations */
    .dorayaki-unit {
      animation: gentleFloat 4s ease-in-out infinite alternate;
      transform-origin: 450px 420px;
    }
    @keyframes gentleFloat {
      0% { transform: translateY(6px) rotate(-0.8deg); }
      100% { transform: translateY(-10px) rotate(1deg); }
    }

    .steam-rise-1 {
      animation: steamMove1 3.5s ease-out infinite;
      transform-origin: 400px 220px;
    }
    .steam-rise-2 {
      animation: steamMove2 4s ease-out infinite 1.2s;
      transform-origin: 500px 200px;
    }
    @keyframes steamMove1 {
      0% { transform: translateY(0) scaleX(1); opacity: 0; }
      40% { opacity: 0.55; }
      100% { transform: translateY(-70px) scaleX(1.4); opacity: 0; }
    }
    @keyframes steamMove2 {
      0% { transform: translateY(0) scaleX(0.9); opacity: 0; }
      40% { opacity: 0.45; }
      100% { transform: translateY(-80px) scaleX(1.5); opacity: 0; }
    }

    .sparkle {
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    .delay-1 { animation-delay: 0.7s; }
    .delay-2 { animation-delay: 1.4s; }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- Warm Creamy Background -->
  <rect width="900" height="800" fill="url(#bgGlow)"/>

  <!-- Background Sunshine / Pattern Accents -->
  <g opacity="0.3" stroke="#e68a2e" stroke-width="1.5" fill="none">
    <circle cx="450" cy="430" r="360" stroke-dasharray="12 12"/>
    <circle cx="450" cy="430" r="340" stroke-dasharray="4 8"/>
  </g>

  <!-- Sparkles of Fresh Baked Goodness -->
  <g filter="url(#softGlow)">
    <path d="M 180,220 Q 180,235 195,235 Q 180,235 180,250 Q 180,235 165,235 Q 180,235 180,220 Z" fill="#ffbf66" class="sparkle"/>
    <path d="M 720,260 Q 720,278 738,278 Q 720,278 720,296 Q 720,278 702,278 Q 720,278 720,260 Z" fill="#e68a2e" class="sparkle delay-1"/>
    <path d="M 240,600 Q 240,612 252,612 Q 240,612 240,624 Q 240,612 228,612 Q 240,612 240,600 Z" fill="#ffbf66" class="sparkle delay-2"/>
  </g>

  <!-- ================= CERAMIC PLATE ================= -->
  <g id="plate">
    <!-- Outer Plate Shadow on Table -->
    <ellipse cx="450" cy="580" rx="360" ry="110" fill="#a07855" opacity="0.3" filter="url(#dropShadow)"/>

    <!-- Plate Outer Rim -->
    <ellipse cx="450" cy="570" rx="350" ry="100" fill="url(#plateRim)"/>
    <!-- Plate Inner Dish Surface -->
    <ellipse cx="450" cy="565" rx="330" ry="90" fill="url(#plateGrad)"/>
    <!-- Inner Rim Highlight Ring -->
    <ellipse cx="450" cy="565" rx="270" ry="70" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- Shadow Directly Under Dorayaki -->
  <ellipse cx="450" cy="520" rx="240" ry="55" fill="#3d0c18" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Rising Delicious Hot Steam -->
  <g filter="url(#steamBlur)">
    <path class="steam-rise-1" d="M 380,260 C 360,200 420,170 390,120" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <path class="steam-rise-2" d="M 480,250 C 510,190 460,160 490,100" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- ================= MAIN DORAYAKI ================= -->
  <g class="dorayaki-unit" filter="url(#dropShadow)">

    <!-- 1. BOTTOM PANCAKE SHELL -->
    <g id="bottom-shell">
      <path d="M 210,430 
               C 210,490 310,545 450,545 
               C 590,545 690,490 690,430 
               C 690,420 670,410 630,415 
               C 570,422 450,425 450,425 
               C 450,425 330,422 270,415 
               C 230,410 210,420 210,430 Z" 
            fill="url(#pancakeBottom)"/>
      
      <!-- Bottom Crust Highlight Rim -->
      <path d="M 225,440 C 300,505 450,525 675,440" fill="none" stroke="#e68a2e" stroke-width="4" opacity="0.4"/>
    </g>

    <!-- 2. ANKO (RED BEAN PASTE) FILLING LAYER -->
    <g id="anko-layer">
      <!-- Main Thick Anko Mound Extruding Between Shells -->
      <path d="M 220,415 
               C 200,395 240,370 310,365 
               C 380,360 520,360 590,365 
               C 660,370 700,395 680,415 
               C 660,435 590,455 450,458 
               C 310,455 240,435 220,415 Z" 
            fill="url(#ankoCenter)" 
            stroke="#1a0309" 
            stroke-width="2"/>

      <!-- Glossy Shiny Reflection on Sweet Red Bean Filling -->
      <path d="M 240,410 C 290,435 450,448 660,410 C 600,430 450,438 240,410 Z" fill="url(#ankoShine)"/>

      <!-- Chunky Red Bean Textures (Azuki Beans Visible in Filling) -->
      <g fill="#24050d" stroke="#5a1827" stroke-width="1.5">
        <!-- Individual Azuki Beans -->
        <ellipse cx="270" cy="412" rx="10" ry="6" transform="rotate(-15 270 412)"/>
        <ellipse cx="320" cy="422" rx="12" ry="7" transform="rotate(10 320 422)"/>
        <ellipse cx="380" cy="428" rx="11" ry="6" transform="rotate(-5 380 428)"/>
        <ellipse cx="440" cy="430" rx="13" ry="7" transform="rotate(8 440 430)"/>
        <ellipse cx="510" cy="426" rx="12" ry="6" transform="rotate(-12 510 426)"/>
        <ellipse cx="580" cy="420" rx="11" ry="7" transform="rotate(15 580 420)"/>
        <ellipse cx="630" cy="410" rx="10" ry="6" transform="rotate(-8 630 410)"/>

        <!-- Bean Highlights -->
        <g fill="#8c2b3f" stroke="none">
          <circle cx="268" cy="410" r="2"/>
          <circle cx="318" cy="420" r="2.5"/>
          <circle cx="438" cy="428" r="2.5"/>
          <circle cx="508" cy="424" r="2"/>
          <circle cx="578" cy="418" r="2"/>
        </g>
      </g>
    </g>

    <!-- 3. FLUFFY SPONGE CAKE INSIDE EDGES (Where Shell Meets Filling) -->
    <g id="sponge-cake-rim" fill="none" stroke="url(#spongeEdge)" stroke-width="5" stroke-linecap="round">
      <path d="M 210,390 C 260,375 350,368 450,368 C 550,368 640,375 690,390"/>
      <path d="M 225,420 C 300,438 450,442 675,420" stroke-width="3" opacity="0.8"/>
    </g>

    <!-- 4. TOP PANCAKE SHELL (Smooth Golden Brown Dome) -->
    <g id="top-shell">
      <!-- Main Upper Golden Crust -->
      <path d="M 200,385 
               C 190,330 270,240 450,240 
               C 630,240 710,330 700,385 
               C 690,410 610,422 450,425 
               C 290,422 210,410 200,385 Z" 
            fill="url(#pancakeTop)"/>

      <!-- Smooth Shiny Highlight Gradient on Top Dome -->
      <path d="M 230,350 
               C 250,290 330,255 450,255 
               C 570,255 650,290 670,350 
               C 590,320 450,310 230,350 Z" 
            fill="url(#pancakeHighlight)"/>

      <!-- Top Soft Center Glow (Classic Honey-Baked Bronze Center) -->
      <ellipse cx="450" cy="320" rx="160" ry="45" fill="#ffe6b3" opacity="0.15" filter="url(#softGlow)"/>

      <!-- Soft Crease / Edge Shadowing around Top Shell Curve -->
      <path d="M 205,385 C 280,412 450,418 695,385" fill="none" stroke="#592900" stroke-width="4" opacity="0.4"/>
      <path d="M 200,385 C 190,330 270,240 450,240 C 630,240 710,330 700,385" fill="none" stroke="#803d00" stroke-width="3" opacity="0.5"/>
    </g>

    <!-- OPTIONAL TRADITIONAL BRANDING STAMP (Doraemon's Bell or Cherry Blossom Style) -->
    <g id="stamp" opacity="0.25" transform="translate(450, 310) rotate(-5)">
      <!-- Cute Bell Outline Burned into Pancake -->
      <path d="M -15,-10 C -15,-22 15,-22 15,-10 C 18,-2 22,10 25,15 L -25,15 C -22,10 -18,-2 -15,-10 Z" fill="#331400"/>
      <rect x="-27" y="15" width="54" height="6" rx="3" fill="#331400"/>
      <circle cx="0" cy="27" r="6" fill="#331400"/>
      <line x1="0" y1="33" x2="0" y2="40" stroke="#331400" stroke-width="3"/>
    </g>

  </g> <!-- END DORAYAKI GROUP -->

  <!-- FOREGROUND SWEET CRUMBS ON PLATE -->
  <g fill="#cc6600" opacity="0.85">
    <ellipse cx="280" cy="540" rx="4" ry="2.5" transform="rotate(15 280 540)"/>
    <ellipse cx="300" cy="550" rx="3" ry="2" transform="rotate(-20 300 550)"/>
    <ellipse cx="610" cy="535" rx="5" ry="3" transform="rotate(10 610 535)"/>
    <ellipse cx="630" cy="542" rx="3" ry="2" transform="rotate(-5 630 542)"/>
    <!-- Anko Little Droplet Crumbs -->
    <circle cx="265" cy="525" r="2.5" fill="#3d0c18"/>
    <circle cx="645" cy="520" r="3" fill="#3d0c18"/>
  </g>

</svg>
