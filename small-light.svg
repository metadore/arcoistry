<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800">

  <defs>

    <!-- Background -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#180033"/>
      <stop offset="50%" stop-color="#0a001a"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>

    <!-- Silver -->
    <linearGradient id="bodySilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e6e6fb"/>
      <stop offset="70%" stop-color="#9999bb"/>
      <stop offset="100%" stop-color="#4d4d66"/>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#ccab00"/>
      <stop offset="100%" stop-color="#665500"/>
    </linearGradient>

    <!-- Blue Handle -->
    <linearGradient id="handleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d5ff"/>
      <stop offset="40%" stop-color="#0088cc"/>
      <stop offset="85%" stop-color="#004488"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>

    <!-- Red Switch -->
    <linearGradient id="switchRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6680"/>
      <stop offset="50%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#80001a"/>
    </linearGradient>

    <!-- Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#fff275" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffaa00" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#ff5500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>

    <!-- Lens -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffaa"/>
      <stop offset="80%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong Glow -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="-5"
        dy="15"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.85"
      />
    </filter>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND                                             -->
  <!-- ====================================================== -->

  <rect
    x="0"
    y="0"
    width="900"
    height="800"
    fill="url(#bgGradient)"
  />


  <!-- ====================================================== -->
  <!-- STARS                                                  -->
  <!-- ====================================================== -->

  <g fill="#ffffff">

    <circle cx="120" cy="150" r="1.5">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="1.4s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="800" cy="180" r="2" fill="#ffd700">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.1s"
        begin="0.5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="180" cy="680" r="1.2" fill="#ff0055">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.8s"
        begin="1s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="820" cy="620" r="1.8">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="1.4s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="480" cy="120" r="1.4" fill="#00ffff">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.1s"
        begin="0.5s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- ====================================================== -->
  <!-- GROUND SHADOW                                          -->
  <!-- ====================================================== -->

  <ellipse
    cx="450"
    cy="690"
    rx="360"
    ry="35"
    fill="#000000"
    opacity="0.7"
    filter="url(#strongGlow)"
  />


  <!-- ====================================================== -->
  <!-- SHRINKING LIGHT BEAM                                   -->
  <!-- ====================================================== -->

  <g>

    <polygon
      points="350,380 780,180 780,620"
      fill="url(#beamGrad)"
      filter="url(#strongGlow)"
      opacity="0.8"
    />

    <polygon
      points="350,385 750,220 750,580"
      fill="url(#beamGrad)"
      opacity="0.8"
    />

    <!-- Beam pulse -->
    <animateTransform
      attributeName="transform"
      type="scale"
      values="1 0.97;1 1.03;1 0.97"
      dur="1.8s"
      repeatCount="indefinite"
      additive="sum"
    />

  </g>


  <!-- ====================================================== -->
  <!-- TARGET RINGS                                          -->
  <!-- ====================================================== -->

  <g
    stroke="#ffd700"
    stroke-width="1.5"
    fill="none"
    opacity="0.7"
  >

    <ellipse
      cx="720"
      cy="400"
      rx="40"
      ry="140"
      stroke-dasharray="15 10 30 10"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 720 400"
        to="360 720 400"
        dur="12s"
        repeatCount="indefinite"
      />
    </ellipse>

    <ellipse
      cx="720"
      cy="400"
      rx="25"
      ry="90"
      stroke-dasharray="8 8"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 720 400"
        to="360 720 400"
        dur="12s"
        repeatCount="indefinite"
      />
    </ellipse>

  </g>


  <!-- Outer rotating ring -->

  <g
    stroke="#ffffff"
    stroke-width="2"
    fill="none"
    opacity="0.8"
    filter="url(#glow)"
  >

    <ellipse
      cx="720"
      cy="400"
      rx="55"
      ry="180"
      stroke-dasharray="25 15 10 15"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 720 400"
        to="-360 720 400"
        dur="16s"
        repeatCount="indefinite"
      />
    </ellipse>

  </g>


  <!-- ====================================================== -->
  <!-- INWARD ARROWS                                         -->
  <!-- ====================================================== -->

  <g
    stroke="#ffffff"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  >

    <path d="M650 280 L610 300 L650 320"/>

    <path d="M680 380 L640 400 L680 420"/>

    <path d="M650 480 L610 500 L650 520"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-35 0;0 0"
      dur="1.5s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="1.5s"
      repeatCount="indefinite"
    />

  </g>


  <!-- ====================================================== -->
  <!-- ENERGY PARTICLES                                      -->
  <!-- ====================================================== -->

  <g filter="url(#strongGlow)">

    <circle cx="700" cy="320" r="5" fill="#ffffff">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-220 15"
        dur="3s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;0.9;0"
        dur="3s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="730" cy="450" r="4" fill="#ffd700">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-220 15"
        dur="3s"
        begin="0.8s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;0.9;0"
        dur="3s"
        begin="0.8s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="680" cy="510" r="6" fill="#ff5500">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-220 15"
        dur="3s"
        begin="1.6s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;0.9;0"
        dur="3s"
        begin="1.6s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="750" cy="260" r="3.5" fill="#ffffff">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-220 15"
        dur="3s"
        begin="2.4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0;0.9;0"
        dur="3s"
        begin="2.4s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- ====================================================== -->
  <!-- SMALL LIGHT TORCH                                     -->
  <!-- ====================================================== -->

  <g filter="url(#shadow)">

    <!-- HANGER LOOP -->

    <path
      d="M100 380
         C80 380 70 390 70 400
         C70 410 80 420 100 420 Z"
      fill="none"
      stroke="url(#ringGold)"
      stroke-width="7"
      stroke-linecap="round"
    />

    <rect
      x="95"
      y="382"
      width="15"
      height="36"
      rx="3"
      fill="url(#ringGold)"
      stroke="#4d3b00"
      stroke-width="1"
    />


    <!-- BLUE HANDLE -->

    <path
      d="M105 355
         L230 365
         C240 365 245 370 245 400
         C245 430 240 435 230 435
         L105 445
         C95 445 90 430 90 400
         C90 370 95 355 105 355 Z"
      fill="url(#handleBlue)"
      stroke="#001122"
      stroke-width="2.5"
    />


    <!-- HANDLE GROOVES -->

    <g
      stroke="#002244"
      stroke-width="3"
      opacity="0.6"
    >
      <line x1="125" y1="360" x2="125" y2="440"/>
      <line x1="140" y1="361" x2="140" y2="439"/>
      <line x1="155" y1="362" x2="155" y2="438"/>
      <line x1="170" y1="362" x2="170" y2="438"/>
    </g>


    <!-- HANDLE HIGHLIGHT -->

    <path
      d="M110 368 L225 374"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.55"
    />


    <!-- RED SWITCH -->

    <rect
      x="145"
      y="342"
      width="35"
      height="18"
      rx="4"
      fill="url(#switchRed)"
      stroke="#4d0010"
      stroke-width="1.5"
    />

    <rect
      x="160"
      y="337"
      width="16"
      height="23"
      rx="3"
      fill="url(#ringGold)"
      stroke="#665500"
      stroke-width="1"
    />

    <line
      x1="168"
      y1="340"
      x2="168"
      y2="357"
      stroke="#4d3b00"
      stroke-width="1.5"
    />


    <!-- GOLD COLLAR -->

    <path
      d="M230 362
         L255 360
         C262 360 265 370 265 400
         C265 430 262 440 255 440
         L230 438 Z"
      fill="url(#ringGold)"
      stroke="#4d3b00"
      stroke-width="2"
    />


    <!-- SILVER FRONT CONE -->

    <path
      d="M255 360
         L340 310
         C355 310 360 330 360 400
         C360 470 355 490 340 490
         L255 440 Z"
      fill="url(#bodySilver)"
      stroke="#33334d"
      stroke-width="2.5"
    />


    <!-- GOLD FRONT RIM -->

    <ellipse
      cx="340"
      cy="400"
      rx="16"
      ry="90"
      fill="url(#ringGold)"
      stroke="#4d3b00"
      stroke-width="2"
    />


    <!-- REFLECTION -->

    <path
      d="M260 363 L335 320"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.7"
    />

    <path
      d="M260 437 L335 480"
      stroke="#000000"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.25"
    />


    <!-- LENS -->

    <ellipse
      cx="344"
      cy="400"
      rx="11"
      ry="84"
      fill="url(#lensGlow)"
      filter="url(#glow)"
    />

    <ellipse
      cx="346"
      cy="400"
      rx="6"
      ry="76"
      fill="#ffffff"
    />

  </g>


  <!-- ====================================================== -->
  <!-- LENS LIGHT BURST                                     -->
  <!-- ====================================================== -->

  <g
    transform="translate(346 400)"
    filter="url(#strongGlow)"
  >

    <path
      d="M0 -40 L0 40
         M-30 0 L30 0
         M-20 -25 L20 25
         M-20 25 L20 -25"
      stroke="#ffffff"
      stroke-width="3.5"
      opacity="0.9"
    />

    <circle
      cx="0"
      cy="0"
      r="18"
      fill="#ffffff"
    />

    <circle
      cx="0"
      cy="0"
      r="32"
      fill="#ffd700"
      opacity="0.5"
    >
      <animate
        attributeName="r"
        values="25;38;25"
        dur="1.4s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.3;0.7;0.3"
        dur="1.4s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- ====================================================== -->
  <!-- FRONT SPARKLES                                        -->
  <!-- ====================================================== -->

  <g filter="url(#strongGlow)">

    <path
      d="M180 240
         Q180 255 195 255
         Q180 255 180 270
         Q180 255 165 255
         Q180 255 180 240 Z"
      fill="#ffd700"
    >
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="1.4s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="scale"
        values="0.7;1.3;0.7"
        dur="1.4s"
        repeatCount="indefinite"
        additive="sum"
      />
    </path>


    <path
      d="M310 190
         Q310 208 328 208
         Q310 208 310 226
         Q310 208 292 208
         Q310 208 310 190 Z"
      fill="#ffffff"
    >
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.1s"
        begin="0.5s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="scale"
        values="0.7;1.3;0.7"
        dur="2.1s"
        begin="0.5s"
        repeatCount="indefinite"
        additive="sum"
      />
    </path>

  </g>

</svg>
