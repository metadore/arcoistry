<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <!-- Dark Cosmic Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#180033"/>
      <stop offset="50%" stop-color="#0a001a"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>

    <!-- Metallic Torch Casing Gradients -->
    <linearGradient id="bodySilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e6e6fb"/>
      <stop offset="70%" stop-color="#9999bb"/>
      <stop offset="100%" stop-color="#4d4d66"/>
    </linearGradient>

    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#ccab00"/>
      <stop offset="100%" stop-color="#665500"/>
    </linearGradient>

    <linearGradient id="handleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d5ff"/>
      <stop offset="40%" stop-color="#0088cc"/>
      <stop offset="85%" stop-color="#004488"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>

    <linearGradient id="switchRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6680"/>
      <stop offset="50%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#80001a"/>
    </linearGradient>

    <!-- Shrinking Light Cone Beam -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#fff275" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffaa00" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#ff5500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffaa"/>
      <stop offset="80%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </radialGradient>

    <!-- Filters for Intense Shrink Ray Aura -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-5" dy="15" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <style>
    /* Floating Motion for the Small Light Torch */
    .torch-unit {
      animation: torchHover 4s ease-in-out infinite alternate;
      transform-origin: 260px 400px;
    }

    @keyframes torchHover {
      0% {
        transform: translateY(10px) rotate(-1.5deg);
      }
      100% {
        transform: translateY(-14px) rotate(2deg);
      }
    }

    /* Shrinking Beam Pulsing */
    .light-beam {
      animation: beamPulse 1.8s ease-in-out infinite alternate;
      transform-origin: 350px 400px;
    }

    @keyframes beamPulse {
      0% {
        opacity: 0.75;
        transform: scaleY(0.96);
      }
      100% {
        opacity: 1;
        transform: scaleY(1.04);
      }
    }

    /* Target Grid Rings Animation */
    .grid-ring-cw {
      animation: spinCW 12s linear infinite;
      transform-origin: 720px 400px;
    }

    .grid-ring-ccw {
      animation: spinCCW 16s linear infinite;
      transform-origin: 720px 400px;
    }

    @keyframes spinCW {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes spinCCW {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(-360deg);
      }
    }

    /* Shrinking Arrow Indicator Animation */
    .shrink-arrows {
      animation: shrinkArrowMove 1.5s ease-in-out infinite;
    }

    @keyframes shrinkArrowMove {
      0% {
        transform: translateX(0px);
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateX(-35px);
        opacity: 0;
      }
    }

    /* Sparkle & Floating Particle Animations */
    .sparkle-1 {
      animation: twinkle 1.4s ease-in-out infinite alternate;
    }

    .sparkle-2 {
      animation: twinkle 2.1s ease-in-out infinite alternate 0.5s;
    }

    .sparkle-3 {
      animation: twinkle 2.8s ease-in-out infinite alternate 1.0s;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.2;
        transform: scale(0.6);
      }
      100% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    .particle-float {
      animation: floatLeft 3s linear infinite;
    }

    .delay-1 {
      animation-delay: 0.8s;
    }

    .delay-2 {
      animation-delay: 1.6s;
    }

    .delay-3 {
      animation-delay: 2.4s;
    }

    @keyframes floatLeft {
      0% {
        transform: translateX(0px) translateY(0px) scale(1);
        opacity: 0;
      }
      30% {
        opacity: 0.9;
      }
      100% {
        transform: translateX(-220px) translateY(15px) scale(0.2);
        opacity: 0;
      }
    }
  </style>

  <!-- Deep Space Background -->
  <rect width="900" height="800" fill="url(#bgGradient)"/>

  <!-- Background Ambient Glow & Stars -->
  <g opacity="0.6">
    <circle cx="120" cy="150" r="1.5" fill="#fff" class="sparkle-1"/>
    <circle cx="800" cy="180" r="2" fill="#ffd700" class="sparkle-2"/>
    <circle cx="180" cy="680" r="1.2" fill="#ff0055" class="sparkle-3"/>
    <circle cx="820" cy="620" r="1.8" fill="#fff" class="sparkle-1"/>
    <circle cx="480" cy="120" r="1.4" fill="#00ffff" class="sparkle-2"/>
  </g>

  <!-- Ground Shadow / Aura -->
  <ellipse
    cx="450"
    cy="690"
    rx="360"
    ry="35"
    fill="#000000"
    opacity="0.7"
    filter="url(#intenseGlow)"
  />

  <!-- ================= SHRINKING LIGHT BEAM & CONE ================= -->
  <g class="light-beam">

    <!-- Outer Cone Arc Glow -->
    <polygon
      points="350,380 780,180 780,620"
      fill="url(#beamGrad)"
      filter="url(#intenseGlow)"
    />

    <polygon
      points="350,385 750,220 750,580"
      fill="url(#beamGrad)"
    />

    <!-- Concentric Shrinking Target Grid / Rings at Ray Focus -->
    <g
      class="grid-ring-cw"
      stroke="#ffd700"
      stroke-width="1.5"
      fill="none"
      opacity="0.7"
    >
      <ellipse
        cx="720"
        cy="400"
        rx="40"
        ry="140"
        stroke-dasharray="15 10 30 10"
      />

      <ellipse
        cx="720"
        cy="400"
        rx="25"
        ry="90"
        stroke-dasharray="8 8"
      />
    </g>

    <g
      class="grid-ring-ccw"
      stroke="#ffffff"
      stroke-width="2"
      fill="none"
      opacity="0.8"
      filter="url(#softGlow)"
    >
      <ellipse
        cx="720"
        cy="400"
        rx="55"
        ry="180"
        stroke-dasharray="25 15 10 15"
      />
    </g>

  </g>

  <!-- Shrinking Motion Vectors / Arrows pointing INWARD -->
  <g
    class="shrink-arrows"
    stroke="#ffffff"
    stroke-width="3"
    fill="none"
    opacity="0.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  >

    <!-- Top Arrow set -->
    <path d="M 650,280 L 610,300 L 650,320"/>

    <!-- Middle Arrow set -->
    <path d="M 680,380 L 640,400 L 680,420"/>

    <!-- Bottom Arrow set -->
    <path d="M 650,480 L 610,500 L 650,520"/>

  </g>

  <!-- Floating Energy Shrink Particles -->
  <g filter="url(#intenseGlow)">
    <circle
      cx="700"
      cy="320"
      r="5"
      fill="#ffffff"
      class="particle-float"
    />

    <circle
      cx="730"
      cy="450"
      r="4"
      fill="#ffd700"
      class="particle-float delay-1"
    />

    <circle
      cx="680"
      cy="510"
      r="6"
      fill="#ff5500"
      class="particle-float delay-2"
    />

    <circle
      cx="750"
      cy="260"
      r="3.5"
      fill="#ffffff"
      class="particle-float delay-3"
    />
  </g>

  <!-- ================= SMALL LIGHT TORCH (DORAEMON GADGET) ================= -->

  <g class="torch-unit" filter="url(#dropShadow)">

    <!-- 1. BACK CAP / HANGER LOOP -->
    <path
      d="M 100,380
         C 80,380 70,390 70,400
         C 70,410 80,420 100,420 Z"
      fill="none"
      stroke="url(#ringGold)"
      stroke-width="7"
      stroke-linecap="round"
    />

    <rect
      x="95"
      y="382"
      width="15"
      height="36"
      rx="3"
      fill="url(#ringGold)"
      stroke="#4d3b00"
      stroke-width="1"
    />

    <!-- 2. MAIN BLUE CYLINDRICAL HANDLE -->
    <path
      d="M 105,355
         L 230,365
         C 240,365 245,370 245,400
         C 245,430 240,435 230,435
         L 105,445
         C 95,445 90,430 90,400
         C 90,370 95,355 105,355 Z"
      fill="url(#handleBlue)"
      stroke="#001122"
      stroke-width="2.5"
    />

    <!-- Handle Grip Grooves / Ridges -->
    <g stroke="#002244" stroke-width="3" opacity="0.6">
      <line x1="125" y1="360" x2="125" y2="440"/>
      <line x1="140" y1="361" x2="140" y2="439"/>
      <line x1="155" y1="362" x2="155" y2="438"/>
      <line x1="170" y1="362" x2="170" y2="438"/>
    </g>

    <!-- Handle Highlight Shine -->
    <path
      d="M 110,368 L 225,374"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.55"
    />

    <!-- 3. RED ON/OFF SLIDE SWITCH -->
    <rect
      x="145"
      y="342"
      width="35"
      height="18"
      rx="4"
      fill="url(#switchRed)"
      stroke="#4d0010"
      stroke-width="1.5"
    />

    <!-- Switch Ridge Button -->
    <rect
      x="160"
      y="337"
      width="16"
      height="23"
      rx="3"
      fill="url(#ringGold)"
      stroke="#665500"
      stroke-width="1"
    />

    <line
      x1="168"
      y1="340"
      x2="168"
      y2="357"
      stroke="#4d3b00"
      stroke-width="1.5"
    />

    <!-- 4. GOLDEN MID-RING / ACCENT COLLAR -->
    <path
      d="M 230,362
         L 255,360
         C 262,360 265,370 265,400
         C 265,430 262,440 255,440
         L 230,438 Z"
      fill="url(#ringGold)"
      stroke="#4d3b00"
      stroke-width="2"
    />

    <!-- 5. FRONT CONICAL BELL / CROWN -->
    <path
      d="M 255,360
         L 340,310
         C 355,310 360,330 360,400
         C 360,470 355,490 340,490
         L 255,440 Z"
      fill="url(#bodySilver)"
      stroke="#33334d"
      stroke-width="2.5"
    />

    <!-- Crown Inner Lip / Rim Accent -->
    <ellipse
      cx="340"
      cy="400"
      rx="16"
      ry="90"
      fill="url(#ringGold)"
      stroke="#4d3b00"
      stroke-width="2"
    />

    <!-- Bell Reflection Highlights -->
    <path
      d="M 260,363 L 335,320"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.7"
    />

    <path
      d="M 260,437 L 335,480"
      stroke="#000000"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.25"
    />

    <!-- 6. GLOWING FRONT LENS -->
    <ellipse
      cx="344"
      cy="400"
      rx="11"
      ry="84"
      fill="url(#lensGlow)"
      filter="url(#softGlow)"
    />

    <ellipse
      cx="346"
      cy="400"
      rx="6"
      ry="76"
      fill="#ffffff"
    />

  </g>

  <!-- FOREGROUND BURST / LIGHT FLARE AT LENS -->
  <g
    transform="translate(346, 400)"
    filter="url(#intenseGlow)"
  >

    <!-- Starburst Rays -->
    <path
      d="M 0,-40 L 0,40
         M -30,0 L 30,0
         M -20,-25 L 20,25
         M -20,25 L 20,-25"
      stroke="#ffffff"
      stroke-width="3.5"
      opacity="0.9"
    />

    <circle
      cx="0"
      cy="0"
      r="18"
      fill="#ffffff"
    />

    <circle
      cx="0"
      cy="0"
      r="32"
      fill="#ffd700"
      opacity="0.5"
    />

  </g>

  <!-- Big Front Sparkle Text / Icon Indicator -->
  <g filter="url(#intenseGlow)">

    <path
      d="M 180,240
         Q 180,255 195,255
         Q 180,255 180,270
         Q 180,255 165,255
         Q 180,255 180,240 Z"
      fill="#ffd700"
      class="sparkle-1"
    />

    <path
      d="M 310,190
         Q 310,208 328,208
         Q 310,208 310,226
         Q 310,208 292,208
         Q 310,208 310,190 Z"
      fill="#ffffff"
      class="sparkle-2"
    />

  </g>

</svg>
