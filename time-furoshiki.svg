<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="100%" height="100%">
  <defs>
    <!-- Background Space & Warp Field Gradients -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#15002b"/>
      <stop offset="50%" stop-color="#0a0018"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>

    <!-- Furoshiki Base Colors (Time Fabric Gradient) -->
    <linearGradient id="fabricGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="35%" stop-color="#8000ff"/>
      <stop offset="70%" stop-color="#0055ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Reverse Time Side Fabric Gradient -->
    <linearGradient id="fabricReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#ff00b7"/>
    </linearGradient>

    <!-- Clock Dial Face Metal/Glow Gradient -->
    <radialGradient id="clockFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6f7ff"/>
      <stop offset="90%" stop-color="#b3ecff"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </radialGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b38f00"/>
    </linearGradient>

    <!-- Aura & Glow Filters -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="fabricShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    /* Floating & Undulating Fabric Motion */
    .furoshiki-cloth {
      animation: clothWave 6s ease-in-out infinite alternate;
      transform-origin: 450px 420px;
    }
    @keyframes clothWave {
      0% { transform: translateY(12px) rotate(-1.5deg) scale(0.98); }
      100% { transform: translateY(-18px) rotate(2deg) scale(1.02); }
    }

    /* Clocks Dynamic Rotation & Pulse */
    .clock-group-cw {
      animation: spinClock 25s linear infinite;
      transform-origin: 450px 400px;
    }
    .clock-group-ccw {
      animation: spinClock 18s linear infinite reverse;
      transform-origin: 450px 400px;
    }
    @keyframes spinClock {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Floating Time Energy Rings */
    .ring-spin-1 {
      animation: ringRotate1 10s linear infinite;
      transform-origin: 450px 400px;
    }
    .ring-spin-2 {
      animation: ringRotate2 14s linear infinite reverse;
      transform-origin: 450px 400px;
    }
    @keyframes ringRotate1 {
      0% { transform: scaleY(0.4) rotate(0deg); }
      100% { transform: scaleY(0.4) rotate(360deg); }
    }
    @keyframes ringRotate2 {
      0% { transform: scaleY(0.4) rotate(0deg); }
      100% { transform: scaleY(0.4) rotate(-360deg); }
    }

    /* Fabric Corner Folds Gentle Sway */
    .corner-fold-left {
      animation: foldSwayL 4s ease-in-out infinite alternate;
      transform-origin: 200px 280px;
    }
    @keyframes foldSwayL {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-4deg) translateY(-5px); }
    }

    .corner-fold-right {
      animation: foldSwayR 4.5s ease-in-out infinite alternate 0.5s;
      transform-origin: 700px 280px;
    }
    @keyframes foldSwayR {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(5deg) translateY(-4px); }
    }

    /* Sparkles & Floating Particles */
    .twinkle-1 { animation: twinkle 1.5s ease-in-out infinite alternate; }
    .twinkle-2 { animation: twinkle 2.2s ease-in-out infinite alternate 0.6s; }
    .twinkle-3 { animation: twinkle 2.8s ease-in-out infinite alternate 1.1s; }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    .particle-rise {
      animation: rise 3.5s ease-out infinite;
    }
    .delay-1 { animation-delay: 0.9s; }
    .delay-2 { animation-delay: 1.8s; }
    .delay-3 { animation-delay: 2.7s; }

    @keyframes rise {
      0% { transform: translateY(0px) scale(0.6); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-130px) scale(1.2); opacity: 0; }
    }
  </style>

  <!-- Deep Cosmic Space Background -->
  <rect width="900" height="800" fill="url(#spaceBg)"/>

  <!-- Background Stars & Time Dust -->
  <g opacity="0.6">
    <circle cx="120" cy="140" r="1.5" fill="#fff" class="twinkle-1"/>
    <circle cx="780" cy="160" r="2" fill="#00e5ff" class="twinkle-2"/>
    <circle cx="140" cy="660" r="1.2" fill="#ff00b7" class="twinkle-3"/>
    <circle cx="820" cy="600" r="1.8" fill="#fff" class="twinkle-1"/>
    <circle cx="230" cy="220" r="1" fill="#fff"/>
    <circle cx="710" cy="280" r="1.4" fill="#8000ff"/>
  </g>

  <!-- Ground Aura & Shadow -->
  <ellipse cx="450" cy="680" rx="320" ry="40" fill="#000000" opacity="0.75" filter="url(#intenseGlow)"/>

  <!-- Floating Holographic Time Rings (Under Cloth) -->
  <g class="ring-spin-1" opacity="0.65">
    <circle cx="450" cy="400" r="380" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="20 10 40 15 5 15"/>
    <circle cx="450" cy="400" r="320" fill="none" stroke="#ff00b7" stroke-width="1.5" stroke-dasharray="8 12"/>
  </g>
  <g class="ring-spin-2" opacity="0.5">
    <circle cx="450" cy="400" r="350" fill="none" stroke="#8000ff" stroke-width="2" stroke-dasharray="30 15 10 15"/>
  </g>

  <!-- ================= TIME FUROSHIKI MAIN CLOTH ================= -->
  <g class="furoshiki-cloth" filter="url(#fabricShadow)">

    <!-- BACK / REVERSE SIDE UNFOLDED CORNERS (3D Perspective Thickness) -->
    <!-- Top Left Outer Back Fold -->
    <path d="M 180,240 C 220,180 320,160 450,220 C 350,220 240,250 180,240 Z" fill="url(#fabricReverse)" opacity="0.8"/>
    <!-- Top Right Outer Back Fold -->
    <path d="M 720,240 C 680,180 580,160 450,220 C 550,220 660,250 720,240 Z" fill="url(#fabricReverse)" opacity="0.8"/>

    <!-- MAIN CLOTH BODY (Flowing Wavy Quadrilateral / Square Cloth) -->
    <path d="M 200,260 
             C 320,190 580,190 700,260 
             C 780,380 780,500 700,600 
             C 580,670 320,670 200,600 
             C 120,500 120,380 200,260 Z" 
          fill="url(#fabricGradient)" 
          stroke="#ff99dd" 
          stroke-width="3.5"/>

    <!-- Cloth Edge Hem Trim Line -->
    <path d="M 208,268 
             C 324,202 576,202 692,268 
             C 768,382 768,496 692,592 
             C 576,658 324,658 208,592 
             C 132,496 132,382 208,268 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-dasharray="10 6" 
          opacity="0.75"/>

    <!-- FABRIC FOLD CREASES & CONTOURS (Gives Silk / Satin Depth) -->
    <g fill="none" stroke="#ffffff" opacity="0.25" stroke-linecap="round">
      <path d="M 200,260 C 350,330 550,330 700,260" stroke-width="3"/>
      <path d="M 200,600 C 350,530 550,530 700,600" stroke-width="3"/>
      <path d="M 200,260 C 290,400 290,460 200,600" stroke-width="3"/>
      <path d="M 700,260 C 610,400 610,460 700,600" stroke-width="3"/>
      <!-- Diagonal Dynamic Tension Wrinkles -->
      <path d="M 280,225 C 380,320 520,480 620,575" stroke-width="2"/>
      <path d="M 620,225 C 520,320 380,480 280,575" stroke-width="2"/>
    </g>

    <!-- Shadow Depths in Fold Valleys -->
    <path d="M 200,260 C 300,320 350,400 450,400 C 350,400 250,480 200,600 Z" fill="#000000" opacity="0.12"/>
    <path d="M 700,260 C 600,320 550,400 450,400 C 550,400 650,480 700,600 Z" fill="#000000" opacity="0.12"/>

    <!-- ================= PRINTED TIME CLOCK PATTERNS ================= -->

    <!-- CENTRAL MAIN CLOCK DIAL -->
    <g transform="translate(450, 420)">
      <!-- Outer Glow Ring -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="98" fill="url(#clockFace)" stroke="#003366" stroke-width="3"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#0088cc" stroke-width="1.5" stroke-dasharray="6 4"/>

      <!-- Roman Numerals -->
      <g font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#002244" text-anchor="middle">
        <text x="0" y="-70">XII</text>
        <text x="75" y="5">III</text>
        <text x="0" y="80">VI</text>
        <text x="-75" y="5">IX</text>
        <text x="38" y="-60">I</text>
        <text x="68" y="-30">II</text>
        <text x="68" y="42">IV</text>
        <text x="38" y="70">V</text>
        <text x="-38" y="70">VII</text>
        <text x="-68" y="42">VIII</text>
        <text x="-68" y="-30">X</text>
        <text x="-38" y="-60">XI</text>
      </g>

      <!-- Hands pointing to Time -->
      <line x1="0" y1="0" x2="0" y2="-52" stroke="#cc0055" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="35" y2="-10" stroke="#002244" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="7" fill="url(#goldAccent)" stroke="#002244" stroke-width="1.5"/>
    </g>

    <!-- SURROUNDING CLOCK DIAL PATTERNS (REPEAT REVERSE & FUTURE CLOCKS) -->

    <!-- Top-Left Clock (Past Time) -->
    <g transform="translate(300, 310) scale(0.65)">
      <circle cx="0" cy="0" r="80" fill="url(#clockFace)" stroke="#8000ff" stroke-width="3" opacity="0.9"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#8000ff" stroke-width="1" stroke-dasharray="4 3"/>
      <g font-family="serif" font-size="13" font-weight="bold" fill="#330066" text-anchor="middle">
        <text x="0" y="-55">XII</text><text x="60" y="5">III</text>
        <text x="0" y="62">VI</text><text x="-60" y="5">IX</text>
      </g>
      <line x1="0" y1="0" x2="-25" y2="-35" stroke="#8000ff" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="20" y2="20" stroke="#330066" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#ffd700"/>
    </g>

    <!-- Top-Right Clock (Future Time) -->
    <g transform="translate(600, 310) scale(0.65)">
      <circle cx="0" cy="0" r="80" fill="url(#clockFace)" stroke="#ff007f" stroke-width="3" opacity="0.9"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#ff007f" stroke-width="1" stroke-dasharray="4 3"/>
      <g font-family="serif" font-size="13" font-weight="bold" fill="#660033" text-anchor="middle">
        <text x="0" y="-55">XII</text><text x="60" y="5">III</text>
        <text x="0" y="62">VI</text><text x="-60" y="5">IX</text>
      </g>
      <line x1="0" y1="0" x2="30" y2="-40" stroke="#ff007f" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-30" y2="10" stroke="#660033" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#ffd700"/>
    </g>

    <!-- Bottom-Left Clock -->
    <g transform="translate(300, 530) scale(0.65)">
      <circle cx="0" cy="0" r="80" fill="url(#clockFace)" stroke="#00ccff" stroke-width="3" opacity="0.9"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#00ccff" stroke-width="1" stroke-dasharray="4 3"/>
      <g font-family="serif" font-size="13" font-weight="bold" fill="#003366" text-anchor="middle">
        <text x="0" y="-55">XII</text><text x="60" y="5">III</text>
        <text x="0" y="62">VI</text><text x="-60" y="5">IX</text>
      </g>
      <line x1="0" y1="0" x2="0" y2="-42" stroke="#0099cc" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-25" y2="25" stroke="#003366" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#ffd700"/>
    </g>

    <!-- Bottom-Right Clock -->
    <g transform="translate(600, 530) scale(0.65)">
      <circle cx="0" cy="0" r="80" fill="url(#clockFace)" stroke="#00ff99" stroke-width="3" opacity="0.9"/>
      <circle cx="0" cy="0" r="72" fill="none" stroke="#00ff99" stroke-width="1" stroke-dasharray="4 3"/>
      <g font-family="serif" font-size="13" font-weight="bold" fill="#004d26" text-anchor="middle">
        <text x="0" y="-55">XII</text><text x="60" y="5">III</text>
        <text x="0" y="62">VI</text><text x="-60" y="5">IX</text>
      </g>
      <line x1="0" y1="0" x2="-35" y2="-20" stroke="#00cc7a" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="20" y2="-30" stroke="#004d26" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="5" fill="#ffd700"/>
    </g>

    <!-- DYNAMIC CORNER FOLDS (Tied / Elegant Bent Furoshiki Corners) -->
    <!-- Top-Left Corner Fold -->
    <g class="corner-fold-left">
      <path d="M 200,260 C 150,190 220,130 280,225 Z" fill="url(#fabricReverse)" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 200,260 C 180,210 230,170 280,225 Z" fill="url(#fabricGradient)" opacity="0.6"/>
    </g>

    <!-- Top-Right Corner Fold -->
    <g class="corner-fold-right">
      <path d="M 700,260 C 750,190 680,130 620,225 Z" fill="url(#fabricReverse)" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 700,260 C 720,210 670,170 620,225 Z" fill="url(#fabricGradient)" opacity="0.6"/>
    </g>

    <!-- Bottom Corner Flourishes -->
    <path d="M 200,600 C 160,650 250,680 280,575 Z" fill="url(#fabricReverse)" stroke="#ffffff" stroke-width="1"/>
    <path d="M 700,600 C 740,650 650,680 620,575 Z" fill="url(#fabricReverse)" stroke="#ffffff" stroke-width="1"/>

  </g> <!-- END FUROSHIKI CLOTH GROUP -->

  <!-- FOREGROUND RISING TIME PARTICLES & SPARKLES -->
  <g filter="url(#intenseGlow)">
    <!-- Floating Sparkle Stars -->
    <path d="M 220,200 Q 220,212 232,212 Q 220,212 220,224 Q 220,212 208,212 Q 220,212 220,200 Z" fill="#00e5ff" class="twinkle-1"/>
    <path d="M 680,180 Q 680,195 695,195 Q 680,195 680,210 Q 680,195 665,195 Q 680,195 680,180 Z" fill="#ff00b7" class="twinkle-2"/>
    <path d="M 450,140 Q 450,152 462,152 Q 450,152 450,164 Q 450,152 438,152 Q 450,152 450,140 Z" fill="#ffffff" class="twinkle-3"/>

    <!-- Upward Floating Magic Orbs -->
    <circle cx="320" cy="620" r="3.5" fill="#00e5ff" class="particle-rise"/>
    <circle cx="580" cy="640" r="4" fill="#ff00b7" class="particle-rise delay-1"/>
    <circle cx="450" cy="590" r="3" fill="#ffffff" class="particle-rise delay-2"/>
    <circle cx="240" cy="540" r="4.5" fill="#8000ff" class="particle-rise delay-3"/>
    <circle cx="680" cy="520" r="3" fill="#00ffcc" class="particle-rise delay-1"/>
  </g>
</svg>
