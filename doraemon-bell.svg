<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#e6f7ff"/>
      <stop offset="60%" stop-color="#b3e5ff"/>
      <stop offset="100%" stop-color="#80d4ff"/>
    </radialGradient>

    <!-- Doraemon Collar Red Gradient -->
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#e60000"/>
      <stop offset="80%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>

    <!-- Main Gold Bell Gradient -->
    <radialGradient id="bellGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff5aa"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="75%" stop-color="#e69900"/>
      <stop offset="100%" stop-color="#995c00"/>
    </radialGradient>

    <!-- Bell Rim Horizontal Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b36b00"/>
      <stop offset="20%" stop-color="#ffdb4d"/>
      <stop offset="50%" stop-color="#fff099"/>
      <stop offset="80%" stop-color="#ffd633"/>
      <stop offset="100%" stop-color="#804d00"/>
    </linearGradient>

    <!-- Bell Sound Hole Dark Interior -->
    <radialGradient id="holeDark" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a2e00"/>
      <stop offset="50%" stop-color="#261700"/>
      <stop offset="100%" stop-color="#0d0800"/>
    </radialGradient>

    <!-- Collar Buckle Metal Gradient -->
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>

    <!-- Soft Glow & Drop Shadow Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#002b4d" flood-opacity="0.35"/>
    </filter>

    <filter id="bellGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Gentle Swinging Motion */
    .bell-assembly {
      animation: swing 3s ease-in-out infinite alternate;
      transform-origin: 400px 180px;
    }
    @keyframes swing {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg); }
    }

    /* Sparkle Twinkle Animations */
    .sparkle {
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    .delay-1 { animation-delay: 0.6s; }
    .delay-2 { animation-delay: 1.2s; }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Background Decorative Rings -->
  <g opacity="0.25" stroke="#0088cc" stroke-width="2" fill="none">
    <circle cx="400" cy="430" r="320" stroke-dasharray="16 12"/>
    <circle cx="400" cy="430" r="290" stroke-dasharray="6 8"/>
  </g>

  <!-- Decorative Magical Sparkles -->
  <g filter="url(#bellGlow)">
    <path d="M 160,260 Q 160,275 175,275 Q 160,275 160,290 Q 160,275 145,275 Q 160,275 160,260 Z" fill="#ffcc00" class="sparkle"/>
    <path d="M 640,300 Q 640,318 658,318 Q 640,318 640,336 Q 640,318 622,318 Q 640,318 640,300 Z" fill="#ffffff" class="sparkle delay-1"/>
    <path d="M 200,580 Q 200,592 212,592 Q 200,592 200,604 Q 200,592 188,592 Q 200,592 200,580 Z" fill="#ffcc00" class="sparkle delay-2"/>
  </g>

  <!-- ================= SWINGING BELL ASSEMBLY ================= -->
  <g class="bell-assembly" filter="url(#dropShadow)">

    <!-- 1. DORAEMON'S RED COLLAR -->
    <g id="collar">
      <!-- Collar Band Cutout Curve -->
      <path d="M 140,160 Q 400,230 660,160 L 645,240 Q 400,305 155,240 Z" fill="url(#collarGrad)"/>
      
      <!-- Collar Stitching / Highlight Trim -->
      <path d="M 150,175 Q 400,242 650,175" fill="none" stroke="#ff8080" stroke-width="3" opacity="0.6"/>
      <path d="M 162,228 Q 400,292 638,228" fill="none" stroke="#660000" stroke-width="3" opacity="0.5"/>

      <!-- Collar Metal End Clasps -->
      <rect x="135" y="155" width="16" height="88" rx="4" fill="url(#metalSilver)" transform="rotate(15 143 199)"/>
      <rect x="649" y="155" width="16" height="88" rx="4" fill="url(#metalSilver)" transform="rotate(-15 657 199)"/>
    </g>

    <!-- 2. COLLAR ATTACHMENT LOOP / RING -->
    <g id="attachment-ring">
      <ellipse cx="400" cy="275" rx="35" ry="18" fill="#663d00"/>
      <ellipse cx="400" cy="275" rx="27" ry="12" fill="url(#metalSilver)"/>
      <ellipse cx="400" cy="275" rx="18" ry="7" fill="#2a1a00"/>
    </g>

    <!-- 3. MAIN SPHERICAL GOLD BELL -->
    <g id="bell-body">
      <!-- Main Gold Sphere -->
      <circle cx="400" cy="450" r="180" fill="url(#bellGold)"/>

      <!-- Sphere Edge Shadowing for Depth -->
      <circle cx="400" cy="450" r="180" fill="none" stroke="#804d00" stroke-width="4" opacity="0.7"/>

      <!-- Primary Upper Curved Highlight Rim (Top Ridge) -->
      <path d="M 232,390 Q 400,320 568,390 Q 400,355 232,390 Z" fill="url(#rimGrad)" stroke="#995c00" stroke-width="1.5"/>

      <!-- Secondary Lower Curved Highlight Rim (Bottom Ridge) -->
      <path d="M 222,415 Q 400,345 578,415 Q 400,380 222,415 Z" fill="url(#rimGrad)" stroke="#995c00" stroke-width="1.5"/>

      <!-- Center Groove Dark Divider between Rims -->
      <path d="M 227,402 Q 400,332 573,402" fill="none" stroke="#4d2e00" stroke-width="5.5"/>

      <!-- 4. CENTRAL SOUND HOLE & SLIT -->
      <!-- Circular Center Hole -->
      <circle cx="400" cy="485" r="28" fill="url(#holeDark)" stroke="#995c00" stroke-width="3"/>
      <circle cx="400" cy="485" r="23" fill="#1a0f00"/>

      <!-- Vertical Sound Slit extending to bottom -->
      <path d="M 392,510 L 392,620 Q 400,632 408,620 L 408,510 Z" fill="url(#holeDark)"/>
      <path d="M 395,512 L 395,616 Q 400,625 405,616 L 405,512 Z" fill="#1a0f00"/>

      <!-- Slit Edge Gold Bevel -->
      <path d="M 392,510 L 392,620 Q 400,632 408,620 L 408,510" fill="none" stroke="#663d00" stroke-width="2"/>
    </g>

    <!-- 5. HIGH-GLOSS REFLECTIONS & LIGHTING SPECKLES -->
    <g id="reflections" stroke-linecap="round">
      <!-- Curved Main Specular Light Arc (Top Left) -->
      <path d="M 270,330 A 140 140 0 0 1 360,285" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.75" filter="url(#bellGlow)"/>
      <path d="M 270,330 A 140 140 0 0 1 360,285" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9"/>

      <!-- Secondary Secondary Spot Highlight -->
      <ellipse cx="260" cy="360" rx="9" ry="18" transform="rotate(-30 260 360)" fill="#ffffff" opacity="0.6"/>

      <!-- Subtle Soft Ambient Reflection (Bottom Right Rim) -->
      <path d="M 540,530 A 150 150 0 0 1 470,590" fill="none" stroke="#ffeb99" stroke-width="6" opacity="0.4"/>
    </g>

  </g> <!-- END BELL ASSEMBLY -->

  <!-- Floor Shadow Under Bell -->
  <ellipse cx="400" cy="720" rx="160" ry="22" fill="#003d66" opacity="0.25" filter="url(#dropShadow)"/>
</svg>
